<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Arditore - Software Developer, Digital Forensics" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5FC4E8"/>
      <stop offset="55%" stop-color="#A9E2F6"/>
      <stop offset="100%" stop-color="#E4F6FD"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bergA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D5EEF9"/>
    </linearGradient>
    <linearGradient id="bergB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BFE5F5"/>
    </linearGradient>
    <linearGradient id="floe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E7F6FC"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- sun -->
    <circle cx="1020" cy="86" r="160" fill="url(#sunGlow)"/>
    <circle cx="1020" cy="86" r="40" fill="#FFE07A"/>

    <!-- clouds -->
    <g fill="#FFFFFF" opacity="0.75">
      <ellipse cx="250" cy="62" rx="52" ry="17"/>
      <ellipse cx="292" cy="56" rx="38" ry="21"/>
      <ellipse cx="820" cy="48" rx="44" ry="14"/>
      <ellipse cx="856" cy="44" rx="32" ry="18"/>
    </g>

    <!-- distant range -->
    <path d="M0 236 L120 186 L196 226 L286 166 L372 228 L470 178 L560 236 L690 182 L790 232 L900 176 L1010 230 L1110 190 L1200 234 L1200 320 L0 320 Z" fill="#C6E9F8"/>

    <!-- mid icebergs -->
    <path d="M620 250 L700 172 L742 210 L800 152 L878 250 Z" fill="url(#bergB)"/>
    <path d="M840 252 L930 178 L1000 224 L1062 186 L1160 252 Z" fill="url(#bergA)"/>
    <path d="M700 172 L742 210 L720 250 L700 250 Z" fill="#E8F6FC" opacity="0.8"/>
    <path d="M930 178 L1000 224 L972 252 L930 252 Z" fill="#EDF8FD" opacity="0.8"/>

    <!-- ice floe -->
    <path d="M0 262 Q180 246 360 262 Q540 278 760 262 Q960 248 1200 266 L1200 320 L0 320 Z" fill="url(#floe)"/>
    <g stroke="#C9E8F5" stroke-width="2" fill="none" opacity="0.9">
      <path d="M90 288 L170 284 L232 296"/>
      <path d="M430 292 L520 286 L590 298"/>
      <path d="M880 290 L960 284 L1040 294"/>
    </g>

    <!-- title -->
    <text x="72" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="7" fill="#0C3A50">ARDITORE</text>
    <text x="76" y="188" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="2" fill="#2A6D8C">SOFTWARE DEVELOPER &#183; DIGITAL FORENSICS</text>
    <rect x="76" y="206" width="78" height="7" rx="3.5" fill="#E63946"/>
  </g>
</svg>
