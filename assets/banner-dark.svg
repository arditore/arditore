<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Arditore - Software Developer, Digital Forensics" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05192A"/>
      <stop offset="55%" stop-color="#0B3A55"/>
      <stop offset="100%" stop-color="#12546F"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FE0C0" stop-opacity="0"/>
      <stop offset="45%" stop-color="#4FE0C0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6BB7F0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DCF1FA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#DCF1FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bergDarkA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8ECF6"/>
      <stop offset="100%" stop-color="#5B92AE"/>
    </linearGradient>
    <linearGradient id="bergDarkB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BDDDEC"/>
      <stop offset="100%" stop-color="#3D7391"/>
    </linearGradient>
    <linearGradient id="floeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9FCADD"/>
      <stop offset="100%" stop-color="#3F7691"/>
    </linearGradient>
    <clipPath id="frameDark"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frameDark)">
    <rect width="1200" height="320" fill="#06253A"/>
    <rect width="1200" height="320" fill="url(#nightSky)"/>

    <!-- aurora -->
    <path d="M0 120 Q200 30 420 96 Q660 168 900 72 Q1060 12 1200 74 L1200 172 Q1040 108 880 162 Q640 240 400 176 Q190 120 0 196 Z" fill="url(#aurora)"/>

    <!-- stars -->
    <g fill="#EAF6FC">
      <circle cx="120" cy="44" r="1.8" opacity="0.9"/>
      <circle cx="205" cy="82" r="1.3" opacity="0.7"/>
      <circle cx="318" cy="38" r="1.6" opacity="0.85"/>
      <circle cx="448" cy="70" r="1.2" opacity="0.6"/>
      <circle cx="560" cy="36" r="1.7" opacity="0.9"/>
      <circle cx="668" cy="84" r="1.2" opacity="0.65"/>
      <circle cx="754" cy="42" r="1.5" opacity="0.8"/>
      <circle cx="884" cy="96" r="1.3" opacity="0.7"/>
      <circle cx="1128" cy="52" r="1.6" opacity="0.85"/>
    </g>

    <!-- moon -->
    <circle cx="1020" cy="82" r="150" fill="url(#moonGlow)"/>
    <circle cx="1020" cy="82" r="34" fill="#E9F5FB"/>
    <circle cx="1008" cy="72" r="6" fill="#CFE5EF" opacity="0.7"/>
    <circle cx="1032" cy="94" r="4" fill="#CFE5EF" opacity="0.6"/>

    <!-- distant range -->
    <path d="M0 236 L120 186 L196 226 L286 166 L372 228 L470 178 L560 236 L690 182 L790 232 L900 176 L1010 230 L1110 190 L1200 234 L1200 320 L0 320 Z" fill="#0E4560"/>

    <!-- mid icebergs -->
    <path d="M620 250 L700 172 L742 210 L800 152 L878 250 Z" fill="url(#bergDarkB)"/>
    <path d="M840 252 L930 178 L1000 224 L1062 186 L1160 252 Z" fill="url(#bergDarkA)"/>

    <!-- ice floe -->
    <path d="M0 262 Q180 246 360 262 Q540 278 760 262 Q960 248 1200 266 L1200 320 L0 320 Z" fill="url(#floeDark)"/>
    <g stroke="#CBE7F3" stroke-width="2" fill="none" opacity="0.45">
      <path d="M90 288 L170 284 L232 296"/>
      <path d="M430 292 L520 286 L590 298"/>
      <path d="M880 290 L960 284 L1040 294"/>
    </g>

    <!-- title -->
    <text x="72" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="7" fill="#F2FAFE">ARDITORE</text>
    <text x="76" y="188" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="2" fill="#9FD4EA">SOFTWARE DEVELOPER &#183; DIGITAL FORENSICS</text>
    <rect x="76" y="206" width="78" height="7" rx="3.5" fill="#FF5A6A"/>
  </g>
</svg>
